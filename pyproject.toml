[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gosimine"
version = "0.1.3"
description = "A local-first research workspace for mining companies"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.9", "PySide6>=6.8", "pypdf>=5", "yfinance>=0.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gosimine = "gosimine.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
